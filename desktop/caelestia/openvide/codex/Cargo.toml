[package]
name = "openvide-codex"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
anyhow = "1"
fs2 = "0.4"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
signal-hook = "0.3"
tempfile = "3"
tungstenite = { version = "0.26", default-features = false, features = ["handshake"] }
uuid = "1"
