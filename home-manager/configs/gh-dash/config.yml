prSections:
- title: My Pull Requests
  filters: is:open author:@me
- title: Needs My Review
  filters: is:open review-requested:@me
- title: Involved
  filters: is:open involves:@me -author:@me
issuesSections:
- title: KB · Mes stories
  filters: repo:rgsystemes/kb assignee:@me is:open
- title: My Issues
  filters: is:open author:@me
- title: Assigned
  filters: is:open assignee:@me
- title: Involved
  filters: is:open involves:@me -author:@me
defaults:
  preview:
    open: true
    width: 50
  prsLimit: 20
  issuesLimit: 20
  view: prs
  layout:
    prs:
      updatedAt:
        width: 7
      repo:
        width: 15
      author:
        width: 15
      assignees:
        width: 20
        hidden: true
      base:
        width: 15
        hidden: true
      lines:
        width: 16
    issues:
      updatedAt:
        width: 7
      repo:
        width: 15
      creator:
        width: 10
      assignees:
        width: 20
        hidden: true
  refetchIntervalMinutes: 30
keybindings:
  issues:
  - key: alt+p
    name: voir les PR qui mentionnent cette issue
    command: |
      set -eu
      timeline=$(gh api "repos/{{.RepoName}}/issues/{{.IssueNumber}}/timeline?per_page=100" --paginate --slurp)
      urls=$(printf '%s\n' "$timeline" | jq -r '
          [.[][] | select(.event == "cross-referenced") | .source.issue
          | select(.pull_request != null) | .html_url] | unique | .[]
        ')
      report=$(
        if [ -z "$urls" ]; then
          printf 'Aucune PR accessible ne mentionne cette issue.\n'
        else
          printf '%s\n' "$urls" | while IFS= read -r url; do
            gh pr view "$url" --json number,title,url,state,isDraft --jq '
              (if .state == "MERGED" then "Fusionnée"
               elif .state == "CLOSED" then "Fermée"
               elif .isDraft then "Brouillon"
               else "Ouverte" end) as $state
              | "\(.url | split("/") | .[3:5] | join("/"))#\(.number) — \($state)\n  \(.title | gsub("[[:cntrl:]]"; " "))\n  \(.url)\n"
            ' || exit 1
          done
        fi
      )
      printf 'PR mentionnant {{.RepoName}}#{{.IssueNumber}}\n(q pour revenir à gh-dash)\n\n%s\n' "$report" \
        | less -+F -R
  prs:
  - key: d
    name: ouvrir le diff dans Neovide
    command: |
      set -e
      cd "{{.RepoPath}}"
      base=$(gh pr view --repo "{{.RepoName}}" "{{.PrNumber}}" --json baseRefOid --jq .baseRefOid)
      # Fetch PR refs without checking out or changing the working tree.
      git fetch --no-tags "git@github.com:{{.RepoName}}.git" "$base" "+refs/pull/{{.PrNumber}}/head:refs/gh-dash/{{.PrNumber}}"
      head=$(git rev-parse "refs/gh-dash/{{.PrNumber}}")
      neovide --fork -- -c "DiffviewOpen $base...$head"
repoPaths:
  # Custom commands receive these paths literally, including a leading ~.
  monzey/*: /home/monzey/monzey/*
  monzey/rgsupv-dashboard: /home/monzey/rg/rgsupv-dashboard
  rgsystemes/*: /home/monzey/rg/*
theme:
  # Catppuccin Mocha, mauve accent (catppuccin/gh-dash).
  colors:
    text:
      primary: "#cdd6f4"
      secondary: "#cba6f7"
      inverted: "#11111b"
      faint: "#bac2de"
      warning: "#f9e2af"
      success: "#a6e3a1"
      error: "#f38ba8"
    background:
      selected: "#313244"
    border:
      primary: "#cba6f7"
      secondary: "#45475a"
      faint: "#313244"
  ui:
    table:
      showSeparator: true
pager:
  diff: ""
confirmQuit: false
