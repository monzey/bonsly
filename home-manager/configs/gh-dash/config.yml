prSections:
- title: My Pull Requests
  filters: is:open author:@me
- title: Needs My Review
  filters: is:open review-requested:@me
- title: Involved
  filters: is:open involves:@me -author:@me
issuesSections:
- title: My Issues
  filters: is:open author:@me
- title: Assigned
  filters: is:open assignee:@me
- title: Involved
  filters: is:open involves:@me -author:@me
defaults:
  preview:
    open: true
    width: 50
  prsLimit: 20
  issuesLimit: 20
  view: prs
  layout:
    prs:
      updatedAt:
        width: 7
      repo:
        width: 15
      author:
        width: 15
      assignees:
        width: 20
        hidden: true
      base:
        width: 15
        hidden: true
      lines:
        width: 16
    issues:
      updatedAt:
        width: 7
      repo:
        width: 15
      creator:
        width: 10
      assignees:
        width: 20
        hidden: true
  refetchIntervalMinutes: 30
keybindings:
  issues: []
  prs:
  - key: d
    name: ouvrir le diff dans Neovide
    command: |
      set -e
      cd "{{.RepoPath}}"
      base=$(gh pr view --repo "{{.RepoName}}" "{{.PrNumber}}" --json baseRefOid --jq .baseRefOid)
      # Fetch PR refs without checking out or changing the working tree.
      git fetch --no-tags "git@github.com:{{.RepoName}}.git" "$base" "+refs/pull/{{.PrNumber}}/head:refs/gh-dash/{{.PrNumber}}"
      head=$(git rev-parse "refs/gh-dash/{{.PrNumber}}")
      neovide --fork -- -c "DiffviewOpen $base...$head"
repoPaths:
  monzey/*: ~/monzey/*
  rgsystemes/*: ~/rg/*
theme:
  ui:
    table:
      showSeparator: true
pager:
  diff: ""
confirmQuit: false
